# DeepFilterNet 3 noise removal on the BTD 600 headset mic, offered as the source "DeepFilter Mic".
# It runs in filter-chain.service rather than the main PipeWire daemon, so a plugin crash restarts
# only the filter. The capture side is passive: the headset mic opens only while an app records
# from "DeepFilter Mic". It never falls back to another source, because the default source can be
# this filter itself.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "DeepFilter Mic"
            media.name       = "DeepFilter Mic"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = deepfilter
                        plugin = /usr/lib/ladspa/libdeep_filter_ladspa.so
                        label  = deep_filter_mono
                        control = {
                            # 100 dB removes all the noise it detects; 18-24 keeps some for a more
                            # natural sound.
                            "Attenuation Limit (dB)" 100
                        }
                    }
                ]
            }
            audio.rate     = 48000
            audio.position = [ MONO ]
            capture.props = {
                node.name          = "deepfilter_mic.capture"
                node.passive       = true
                target.object      = "alsa_input.usb-BTD_600_BTD_600_E7E27A419399C4AB3C08-02.mono-fallback"
                node.dont-fallback = true
            }
            playback.props = {
                node.name  = "deepfilter_mic"
                media.class = Audio/Source
            }
        }
    }
]
