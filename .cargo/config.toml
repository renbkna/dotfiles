[build]
rustc-wrapper = "sccache"
# Intermediate artifacts live under ~/.cache (its own subvolume, so /home snapshots skip build churn).
# target/ keeps only final binaries.
build-dir = "/home/ren/.cache/cargo-build/{workspace-path-hash}"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
